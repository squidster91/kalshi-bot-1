<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KalshiMM - RFQ Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg-primary: #0a0c10;
    --bg-secondary: #111318;
    --bg-card: #161921;
    --bg-hover: #1c2030;
    --bg-row-alt: #12141a;
    --border: #1e2230;
    --border-bright: #2a3050;
    --text-primary: #e8eaf0;
    --text-secondary: #7c8190;
    --text-muted: #4a4f62;
    --accent-blue: #3b82f6;
    --accent-green: #22c55e;
    --accent-red: #ef4444;
    --accent-yellow: #eab308;
    --accent-purple: #a855f7;
    --accent-orange: #f97316;
    --accent-cyan: #06b6d4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.4;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Header ── */
  .header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 48px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text-primary);
  }

  .logo span { color: var(--accent-blue); }

  .badge {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .badge-paper { background: rgba(234, 179, 8, 0.12); color: var(--accent-yellow); }
  .badge-live { background: rgba(34, 197, 94, 0.12); color: var(--accent-green); }
  .badge-demo { background: rgba(168, 85, 247, 0.12); color: var(--accent-purple); }
  .badge-prod { background: rgba(59, 130, 246, 0.12); color: var(--accent-blue); }
  .badge-kill { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
    color: var(--text-secondary);
    font-size: 12px;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent-green);
    display: inline-block;
    animation: pulse 2s infinite;
  }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ── Stats Bar ── */
  .stats-bar {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 8px 24px;
    display: flex;
    gap: 32px;
    align-items: center;
    overflow-x: auto;
  }

  .stat-item {
    display: flex;
    align-items: baseline;
    gap: 6px;
    white-space: nowrap;
  }

  .stat-label {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .stat-sep {
    width: 1px;
    height: 20px;
    background: var(--border);
  }

  .positive { color: var(--accent-green) !important; }
  .negative { color: var(--accent-red) !important; }

  /* ── Main Layout ── */
  .main {
    display: grid;
    grid-template-columns: 1fr 320px;
    height: calc(100vh - 48px - 40px);
  }

  .main-left {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }

  .main-right {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-secondary);
  }

  /* ── Section Headers ── */
  .section-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .section-count {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-muted);
    text-transform: none;
    letter-spacing: 0;
  }

  /* ── RFQ Table ── */
  .rfq-table-wrap {
    flex: 1;
    overflow-y: auto;
    overflow-x: auto;
  }

  .rfq-table-wrap::-webkit-scrollbar {
    width: 6px; height: 6px;
  }
  .rfq-table-wrap::-webkit-scrollbar-track {
    background: var(--bg-primary);
  }
  .rfq-table-wrap::-webkit-scrollbar-thumb {
    background: var(--border-bright);
    border-radius: 3px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  thead th {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg-card);
    padding: 8px 12px;
    text-align: left;
    font-weight: 600;
    color: var(--text-muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    border-bottom: 1px solid var(--border-bright);
    white-space: nowrap;
  }

  tbody td {
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    font-size: 12px;
  }

  tbody tr:hover { background: var(--bg-hover); }
  tbody tr:nth-child(even) { background: var(--bg-row-alt); }
  tbody tr:nth-child(even):hover { background: var(--bg-hover); }

  .mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
  }

  /* Category tags */
  .cat-tag {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  .cat-nba { background: rgba(249, 115, 22, 0.15); color: var(--accent-orange); }
  .cat-nfl { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
  .cat-mlb { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
  .cat-nhl { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); }
  .cat-ncaab { background: rgba(168, 85, 247, 0.15); color: var(--accent-purple); }
  .cat-ncaaf { background: rgba(168, 85, 247, 0.12); color: #c084fc; }
  .cat-soccer { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); }
  .cat-politics { background: rgba(234, 179, 8, 0.15); color: var(--accent-yellow); }
  .cat-crypto { background: rgba(249, 115, 22, 0.12); color: #fb923c; }
  .cat-multi { background: rgba(59, 130, 246, 0.10); color: #60a5fa; }
  .cat-cross { background: rgba(168, 85, 247, 0.10); color: #c084fc; }
  .cat-other { background: rgba(124, 129, 144, 0.12); color: var(--text-secondary); }

  /* Legs highlight */
  .legs-high { color: var(--accent-yellow); font-weight: 600; }

  /* Target cost */
  .cost-val { color: var(--accent-green); }

  /* Expandable legs detail */
  .legs-toggle {
    cursor: pointer;
    color: var(--accent-blue);
    text-decoration: none;
    font-weight: 500;
  }
  .legs-toggle:hover { text-decoration: underline; }

  .legs-detail {
    display: none;
  }

  .leg-item {
    display: flex;
    gap: 12px;
    padding: 2px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
  }

  .leg-side-yes { color: var(--accent-green); }
  .leg-side-no { color: var(--accent-red); }

  /* ── Right Panel ── */
  .panel-section {
    border-bottom: 1px solid var(--border);
  }

  /* Chart */
  .chart-container {
    padding: 12px;
    height: 200px;
    position: relative;
  }

  /* Categories */
  .categories-list {
    padding: 8px 12px;
    max-height: 300px;
    overflow-y: auto;
  }

  .cat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    font-size: 12px;
    border-bottom: 1px solid var(--border);
  }

  .cat-row:last-child { border-bottom: none; }

  .cat-name { color: var(--text-primary); }

  .cat-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-secondary);
  }

  .cat-bar {
    height: 3px;
    background: var(--accent-blue);
    border-radius: 2px;
    margin-top: 3px;
    transition: width 0.4s ease;
  }

  /* Summary stats in right panel */
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
  }

  .summary-cell {
    background: var(--bg-secondary);
    padding: 10px 12px;
    text-align: center;
  }

  .summary-cell .stat-label { display: block; margin-bottom: 4px; }
  .summary-cell .stat-value { font-size: 16px; }

  /* ── Empty/loading states ── */
  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
  }

  /* ── Responsive ── */
  @media (max-width: 1024px) {
    .main { grid-template-columns: 1fr; }
    .main-right { display: none; }
  }

  @media (max-width: 768px) {
    .stats-bar { padding: 8px 12px; gap: 16px; }
    .header { padding: 10px 12px; }
  }

  /* Time-ago formatting */
  .time-ago { color: var(--text-secondary); }
  .time-recent { color: var(--accent-green); }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="logo">Kalshi<span>MM</span></div>
    <span id="modeBadge" class="badge badge-paper">PAPER</span>
    <span id="envBadge" class="badge badge-prod">PRODUCTION</span>
    <span id="killBadge" class="badge badge-kill" style="display:none">KILL SWITCH</span>
  </div>
  <div class="header-right">
    <span class="status-dot"></span>
    <span id="lastUpdate">--</span>
  </div>
</div>

<!-- Stats Bar -->
<div class="stats-bar">
  <div class="stat-item">
    <span class="stat-label">RFQs Today</span>
    <span class="stat-value" id="statRfqs">--</span>
  </div>
  <div class="stat-sep"></div>
  <div class="stat-item">
    <span class="stat-label">Quotes</span>
    <span class="stat-value" id="statQuotes">--</span>
  </div>
  <div class="stat-sep"></div>
  <div class="stat-item">
    <span class="stat-label">Fills</span>
    <span class="stat-value" id="statFills">--</span>
  </div>
  <div class="stat-sep"></div>
  <div class="stat-item">
    <span class="stat-label">P&L</span>
    <span class="stat-value" id="statPnl">--</span>
  </div>
  <div class="stat-sep"></div>
  <div class="stat-item">
    <span class="stat-label">Balance</span>
    <span class="stat-value" id="statBalance">--</span>
  </div>
  <div class="stat-sep"></div>
  <div class="stat-item">
    <span class="stat-label">Uptime</span>
    <span class="stat-value" id="statUptime" style="color:var(--text-secondary);font-size:12px">--</span>
  </div>
</div>

<!-- Main Content -->
<div class="main">

  <!-- Left: RFQ Table -->
  <div class="main-left">
    <div class="section-header">
      RFQ Feed
      <span class="section-count" id="rfqCount">Loading...</span>
    </div>
    <div class="rfq-table-wrap">
      <table id="rfqTable">
        <thead>
          <tr>
            <th>Time</th>
            <th>Category</th>
            <th>Market Ticker</th>
            <th>Event</th>
            <th>Legs</th>
            <th>Contracts</th>
            <th>Target Cost</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="rfqTableBody">
          <tr><td colspan="8" class="empty-state">Loading RFQ data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Right: Charts + Categories -->
  <div class="main-right">

    <!-- Summary Stats -->
    <div class="panel-section">
      <div class="section-header">Today's Summary</div>
      <div class="summary-grid">
        <div class="summary-cell">
          <span class="stat-label">Total RFQs</span>
          <span class="stat-value" id="sumRfqs">--</span>
        </div>
        <div class="summary-cell">
          <span class="stat-label">Avg Legs</span>
          <span class="stat-value" id="sumAvgLegs">--</span>
        </div>
      </div>
    </div>

    <!-- RFQ Volume Chart -->
    <div class="panel-section">
      <div class="section-header">RFQ Volume (24h)</div>
      <div class="chart-container">
        <canvas id="volumeChart"></canvas>
      </div>
    </div>

    <!-- Category Breakdown -->
    <div class="panel-section" style="flex:1;overflow:hidden;display:flex;flex-direction:column">
      <div class="section-header">
        Categories
        <span class="section-count" id="catCount"></span>
      </div>
      <div class="categories-list" id="categoriesList">
        <div class="empty-state">Loading...</div>
      </div>
    </div>

  </div>
</div>

<script>
  let volumeChart = null;

  // ── Helpers ──

  function fmt$(v) {
    if (v == null) return '--';
    const n = Number(v);
    return (n >= 0 ? '+' : '') + '$' + Math.abs(n).toFixed(2);
  }

  function fmtUptime(ms) {
    if (!ms) return '--';
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    if (h > 0) return h + 'h ' + m + 'm';
    return m + 'm';
  }

  function timeAgo(iso) {
    if (!iso) return '--';
    const d = new Date(iso);
    const now = Date.now();
    const diff = now - d.getTime();
    if (diff < 0) return 'just now';
    const sec = Math.floor(diff / 1000);
    if (sec < 60) return sec + 's ago';
    const min = Math.floor(sec / 60);
    if (min < 60) return min + 'm ago';
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr + 'h ' + (min % 60) + 'm ago';
    return Math.floor(hr / 24) + 'd ago';
  }

  function timeAgoClass(iso) {
    if (!iso) return 'time-ago';
    const diff = Date.now() - new Date(iso).getTime();
    return diff < 120000 ? 'time-recent' : 'time-ago';
  }

  function pnlClass(v) {
    const n = Number(v);
    if (n > 0) return 'positive';
    if (n < 0) return 'negative';
    return '';
  }

  function parseCategory(ticker) {
    if (!ticker) return { label: 'Unknown', cls: 'cat-other' };
    const t = ticker.toUpperCase();

    if (t.startsWith('KXMVE') || t.includes('CROSS')) return { label: 'Cross-Event', cls: 'cat-cross' };

    if (t.startsWith('KX')) {
      if (t.includes('NBA')) return { label: 'NBA Multi', cls: 'cat-nba' };
      if (t.includes('NFL')) return { label: 'NFL Multi', cls: 'cat-nfl' };
      if (t.includes('MLB')) return { label: 'MLB Multi', cls: 'cat-mlb' };
      if (t.includes('NHL')) return { label: 'NHL Multi', cls: 'cat-nhl' };
      if (t.includes('SOCCER') || t.includes('MLS') || t.includes('EPL')) return { label: 'Soccer Multi', cls: 'cat-soccer' };
      if (t.includes('NCAAB') || t.includes('CBB')) return { label: 'NCAAB Multi', cls: 'cat-ncaab' };
      if (t.includes('NCAAF') || t.includes('CFB')) return { label: 'NCAAF Multi', cls: 'cat-ncaaf' };
      return { label: 'Multi-Game', cls: 'cat-multi' };
    }

    if (t.includes('NBA')) return { label: 'NBA', cls: 'cat-nba' };
    if (t.includes('NFL')) return { label: 'NFL', cls: 'cat-nfl' };
    if (t.includes('MLB')) return { label: 'MLB', cls: 'cat-mlb' };
    if (t.includes('NHL')) return { label: 'NHL', cls: 'cat-nhl' };
    if (t.includes('SOCCER') || t.includes('MLS') || t.includes('EPL')) return { label: 'Soccer', cls: 'cat-soccer' };
    if (t.includes('NCAAB') || t.includes('CBB')) return { label: 'NCAAB', cls: 'cat-ncaab' };
    if (t.includes('NCAAF') || t.includes('CFB')) return { label: 'NCAAF', cls: 'cat-ncaaf' };

    if (t.includes('PRES') || t.includes('ELECT') || t.includes('GOV')) return { label: 'Politics', cls: 'cat-politics' };
    if (t.includes('CRYPTO') || t.includes('BTC') || t.includes('ETH')) return { label: 'Crypto', cls: 'cat-crypto' };

    return { label: 'Other', cls: 'cat-other' };
  }

  function parseLegs(legsJson) {
    if (!legsJson) return [];
    try {
      const legs = typeof legsJson === 'string' ? JSON.parse(legsJson) : legsJson;
      return Array.isArray(legs) ? legs : [];
    } catch { return []; }
  }

  async function fetchJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  // ── Update Stats ──

  async function updateStats() {
    try {
      const data = await fetchJSON('/api/stats');

      document.getElementById('statRfqs').textContent = data.rfqs_seen.toLocaleString();
      document.getElementById('statQuotes').textContent = data.quotes_submitted;
      document.getElementById('statFills').textContent = data.quotes_filled;

      const pnlEl = document.getElementById('statPnl');
      pnlEl.textContent = fmt$(data.today_pnl);
      pnlEl.className = 'stat-value ' + pnlClass(data.today_pnl);

      document.getElementById('statBalance').textContent =
        '$' + Number(data.balance).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      document.getElementById('statUptime').textContent = fmtUptime(data.uptime_ms);

      // Badges
      const modeBadge = document.getElementById('modeBadge');
      if (data.paper_mode) {
        modeBadge.textContent = 'PAPER';
        modeBadge.className = 'badge badge-paper';
      } else {
        modeBadge.textContent = 'LIVE';
        modeBadge.className = 'badge badge-live';
      }

      const envBadge = document.getElementById('envBadge');
      envBadge.textContent = data.env.toUpperCase();
      envBadge.className = 'badge badge-' + (data.env === 'production' ? 'prod' : 'demo');

      const killBadge = document.getElementById('killBadge');
      killBadge.style.display = data.kill_switch ? 'inline' : 'none';
    } catch (err) {
      console.error('Failed to fetch stats:', err);
    }
  }

  // ── Update RFQ Table ──

  async function updateRFQs() {
    try {
      const rfqs = await fetchJSON('/api/rfqs');
      const tbody = document.getElementById('rfqTableBody');
      document.getElementById('rfqCount').textContent = rfqs.length + ' RFQs loaded';

      if (rfqs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No RFQs received yet. Waiting for market activity...</td></tr>';
        return;
      }

      let html = '';
      rfqs.forEach((r, i) => {
        const cat = parseCategory(r.market_ticker);
        const legs = parseLegs(r.legs_json);
        const numLegs = r.num_legs || legs.length || 0;
        const isHighLegs = numLegs >= 5;
        const cost = r.target_cost_dollars;
        const costStr = cost && Number(cost) > 0 ? '$' + Number(cost).toFixed(2) : '--';
        const contracts = r.contracts_requested && Number(r.contracts_requested) > 0
          ? Number(r.contracts_requested).toFixed(0)
          : '--';

        html += `<tr style="${isHighLegs ? 'background:rgba(234,179,8,0.04)' : ''}">
          <td class="mono ${timeAgoClass(r.received_at)}">${timeAgo(r.received_at)}</td>
          <td><span class="cat-tag ${cat.cls}">${cat.label}</span></td>
          <td class="mono" style="max-width:200px;overflow:hidden;text-overflow:ellipsis" title="${r.market_ticker || ''}">${r.market_ticker || '--'}</td>
          <td class="mono" style="color:var(--text-secondary);max-width:160px;overflow:hidden;text-overflow:ellipsis" title="${r.event_ticker || ''}">${r.event_ticker || '--'}</td>
          <td class="${isHighLegs ? 'legs-high' : ''}">
            ${numLegs > 0 && legs.length > 0
              ? `<a class="legs-toggle" onclick="toggleLegs(event, 'legs-${i}')">${numLegs} legs</a>`
              : (numLegs || '--')}
          </td>
          <td class="mono">${contracts}</td>
          <td class="mono cost-val">${costStr}</td>
          <td><span style="color:${r.quoted ? 'var(--accent-blue)' : 'var(--text-muted)'};font-size:11px">${r.quoted ? 'Quoted' : 'Observed'}</span></td>
        </tr>`;

        // Expandable legs detail row
        if (legs.length > 0) {
          html += `<tr id="legs-${i}" class="legs-detail">
            <td colspan="8" style="padding:8px 12px 8px 48px;background:var(--bg-card)">
              ${legs.map(l => {
                const side = (l.side || '').toLowerCase();
                const sideClass = side === 'yes' ? 'leg-side-yes' : 'leg-side-no';
                const ticker = l.market_ticker || '?';
                return `<div class="leg-item">
                  <span class="${sideClass}" style="width:30px">${(side || '?').toUpperCase()}</span>
                  <span style="color:var(--text-primary)">${ticker}</span>
                </div>`;
              }).join('')}
            </td>
          </tr>`;
        }
      });

      tbody.innerHTML = html;
    } catch (err) {
      console.error('Failed to fetch RFQs:', err);
    }
  }

  function toggleLegs(event, id) {
    event.preventDefault();
    const row = document.getElementById(id);
    if (row) {
      row.style.display = row.style.display === 'table-row' ? 'none' : 'table-row';
    }
  }

  // ── Update Volume Chart ──

  async function updateVolumeChart() {
    try {
      const data = await fetchJSON('/api/rfq-volume');
      if (!data || data.length === 0) return;

      const labels = data.map(d => d.label);
      const values = data.map(d => d.count);

      const ctx = document.getElementById('volumeChart').getContext('2d');

      if (volumeChart) {
        volumeChart.data.labels = labels;
        volumeChart.data.datasets[0].data = values;
        volumeChart.update('none');
      } else {
        volumeChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [{
              data: values,
              backgroundColor: values.map(v => v > 0 ? 'rgba(59,130,246,0.5)' : 'rgba(59,130,246,0.1)'),
              borderColor: 'rgba(59,130,246,0.8)',
              borderWidth: 1,
              borderRadius: 2,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#161921',
                borderColor: '#2a3050',
                borderWidth: 1,
                titleColor: '#e8eaf0',
                bodyColor: '#7c8190',
                padding: 8,
                displayColors: false,
                callbacks: {
                  label: ctx => ctx.raw + ' RFQs'
                }
              }
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: { color: '#4a4f62', font: { size: 9 }, maxRotation: 0, maxTicksLimit: 8 },
              },
              y: {
                grid: { color: 'rgba(30,34,48,0.8)' },
                ticks: { color: '#4a4f62', font: { size: 9 }, maxTicksLimit: 5 },
                beginAtZero: true,
              }
            }
          }
        });
      }
    } catch (err) {
      console.error('Failed to fetch volume:', err);
    }
  }

  // ── Update Categories ──

  async function updateCategories() {
    try {
      const data = await fetchJSON('/api/rfq-categories');
      const container = document.getElementById('categoriesList');
      const countEl = document.getElementById('catCount');

      document.getElementById('sumRfqs').textContent = (data.total_rfqs || 0).toLocaleString();
      document.getElementById('sumAvgLegs').textContent = data.avg_legs ? data.avg_legs.toFixed(1) : '--';

      const cats = data.categories || {};
      const entries = Object.entries(cats).sort((a, b) => b[1] - a[1]);
      const maxCount = entries.length > 0 ? entries[0][1] : 1;

      countEl.textContent = entries.length + ' types';

      if (entries.length === 0) {
        container.innerHTML = '<div class="empty-state">No data yet</div>';
        return;
      }

      container.innerHTML = entries.map(([name, count]) => {
        const pct = (count / maxCount * 100).toFixed(0);
        const catInfo = getCatColor(name);
        return `<div class="cat-row">
          <div style="flex:1">
            <div class="cat-name">${name}</div>
            <div class="cat-bar" style="width:${pct}%;background:${catInfo.color}"></div>
          </div>
          <span class="cat-count">${count}</span>
        </div>`;
      }).join('');
    } catch (err) {
      console.error('Failed to fetch categories:', err);
    }
  }

  function getCatColor(name) {
    const n = name.toLowerCase();
    if (n.includes('nba')) return { color: '#f97316' };
    if (n.includes('nfl')) return { color: '#3b82f6' };
    if (n.includes('mlb')) return { color: '#ef4444' };
    if (n.includes('nhl')) return { color: '#06b6d4' };
    if (n.includes('ncaab')) return { color: '#a855f7' };
    if (n.includes('ncaaf')) return { color: '#c084fc' };
    if (n.includes('soccer')) return { color: '#22c55e' };
    if (n.includes('politic')) return { color: '#eab308' };
    if (n.includes('crypto')) return { color: '#fb923c' };
    if (n.includes('cross')) return { color: '#c084fc' };
    if (n.includes('multi')) return { color: '#60a5fa' };
    return { color: '#4a4f62' };
  }

  // ── Refresh All ──

  async function refreshAll() {
    await Promise.all([
      updateStats(),
      updateRFQs(),
      updateVolumeChart(),
      updateCategories(),
    ]);
    document.getElementById('lastUpdate').textContent =
      new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }

  refreshAll();
  setInterval(refreshAll, 15000);
</script>

</body>
